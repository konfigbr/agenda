<div class="page-container rooms-container">
  <div class="header-page-container ">
    <div>
      <mat-icon>today</mat-icon>
      <h1>Minha Agenda</h1>
    </div>
  </div>
  <p class="opt-indicators-container">

    <span *ngIf="showLegendActive" class="opt-ajust-indicators">
      <span class="opt-professional-indicator-squad"></span>
      <span class="opt-professional-indicator"> Profissional</span>
      <!-- <span class="opt-assistant-indicator-squad"></span>
        <span class="opt-assistant-indicator"> Assistente</span> -->
      <!-- <span class="opt-equipment-indicator-squad"></span>
        <span class="opt-equipment-indicator">Equipamentos</span> -->
      <span class="opt-room-indicator-squad"></span>
      <span class="opt-room-indicator"> Sala</span>
    </span>

    <span (click)="showLegends()" mou class="opt-legend-btn">Legenda</span>
  </p>
  <div class="page-content calendar-container">
    <!-- <ng-template #weekViewHourSegmentTemplate let-segment="segment" let-locale="locale"
            let-segmentHeight="segmentHeight" let-isTimeLabel="isTimeLabel">
            <div #segmentElement class="cal-hour-segment" [style.height.px]="segmentHeight"
                [class.cal-hour-start]="segment.isStart" [class.cal-after-hour-start]="!segment.isStart"
                [ngClass]="segment.cssClass" (mousedown)="startDragToCreate(segment, $event, segmentElement)">
                <div class="cal-time" *ngIf="isTimeLabel">
                    {{ segment.date | calendarDate:'weekViewHour':locale }}
                </div>
            </div>
        </ng-template>

        <mwl-calendar-week-view [viewDate]="viewDate" [excludeDays]="excludeDays" [events]="events" [refresh]="refresh"
            [locale]="locale" [hourSegmentTemplate]="weekViewHourSegmentTemplate" [hourSegments]="1" [dayStartHour]="8"
            [dayEndHour]="21" (beforeViewRender)="beforeWeekViewRender($event)">
        </mwl-calendar-week-view> -->
    <div class="header-calendar-navigation">

      <button mat-icon-button class="arrow" mwlCalendarPreviousView [view]="view" [(viewDate)]="viewDate"
        (viewDateChange)="closeOpenMonthViewDay()" [excludeDays]="excludeDays" aria-label="Previous">
        <mat-icon>navigate_before</mat-icon>
      </button>

      <div class="title">
        {{ viewDate | calendarDate:(view + 'ViewTitle'):'pt':weekStartsOn:excludeDays }}
      </div>

      <button mat-icon-button class="arrow" mwlCalendarNextView [view]="view" [(viewDate)]="viewDate"
        (viewDateChange)="closeOpenMonthViewDay()" [excludeDays]="excludeDays" aria-label="Next">
        <mat-icon>navigate_next</mat-icon>
      </button>
    </div>
    <ng-template #weekViewHourSegmentTemplate let-segment="segment" let-locale="locale"
      let-segmentHeight="segmentHeight" let-isTimeLabel="isTimeLabel">
      <div #segmentElement class="cal-hour-segment" [style.height.px]="segmentHeight"
        [class.cal-hour-start]="segment.isStart" [class.cal-after-hour-start]="!segment.isStart"
        [ngClass]="segment.cssClass">
        <div class="cal-time" *ngIf="isTimeLabel">
          {{ segment.date | calendarDate:'weekViewHour':locale }}
        </div>
      </div>
    </ng-template>

    <mwl-calendar-week-view *ngIf="!isLoading" [viewDate]="viewDate" [excludeDays]="excludeDays" [events]="events"
      [refresh]="refresh" [locale]="locale" [hourSegmentTemplate]="weekViewHourSegmentTemplate" [hourSegments]="1"
      [dayStartHour]="8" [dayEndHour]="21" (beforeViewRender)="beforeWeekViewRender($event)">
    </mwl-calendar-week-view>

    <div *ngIf="isLoading" class="opt-loading-page-container">
      <mat-spinner color="light" diameter="75"></mat-spinner>
    </div>
  </div>
</div>
