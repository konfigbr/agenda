<div class="opt-modal-message-container">

  <div *ngIf="step === 'EDIT_DISCOUNT'">
    <app-professionals-discount-component  (refreshUsersEvent)="receiveRefreshUsers($event)" (stepEvent)="receiveStep($event)" [editDiscount]="discountToEditId" [selectedFunction]="step" ></app-professionals-discount-component>
  </div>
  <form *ngIf="step === 'SELECTION'" action="">
    <p *ngIf="selectedFunction === 'LIST'" >Listagem de Descontos</p>
    <p *ngIf="selectedFunction === 'EDIT'" >Editar Descontos</p>
    <table mat-table [dataSource]="dataSource" class="opt-list-items">


      <ng-container matColumnDef="ativo">
        <th mat-header-cell *matHeaderCellDef>Ativo</th>
        <td mat-cell *matCellDef="let element"> {{getTranslate(element?.ativo)}} </td>
      </ng-container>


      <ng-container matColumnDef="tipo">
        <th mat-header-cell *matHeaderCellDef> Tipo </th>
        <td mat-cell *matCellDef="let element"> {{getLabelTipo(element?.tipo)}} </td>
      </ng-container>


      <ng-container matColumnDef="percentual">
        <th mat-header-cell *matHeaderCellDef> Percentual(%)</th>
        <td mat-cell *matCellDef="let element"> {{element.percentual}}% </td>
      </ng-container>


      <ng-container matColumnDef="dataInicio">
        <th mat-header-cell *matHeaderCellDef> Inicio </th>
        <td mat-cell *matCellDef="let element"> {{formatDateWithPattern(element?.dataInicio, 'dd/MM')}} </td>
      </ng-container>

      <ng-container matColumnDef="dataFim">
        <th mat-header-cell *matHeaderCellDef> Fim </th>
        <td mat-cell *matCellDef="let element">{{formatDateWithPattern(element?.dataFim, 'dd/MM')}} </td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef> Ações </th>
        <td mat-cell *matCellDef="let element">
          <div *ngIf="selectedFunction === 'EDIT'">

            <mat-icon matTooltip="Editar" (click)="setEditDiscount(element)">edit</mat-icon>
            <mat-icon matTootip="Excluir" (click)="deleteElement(element.id)">delete</mat-icon>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>

    <div class="opt-modal-message-btn-container">
      <button class="opt-btn-form" (click)="sendStep('SELECTION')" mat-button type="button">Voltar</button>
    </div>

  </form>
</div>
