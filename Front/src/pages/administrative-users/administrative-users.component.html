<div class="page-container equipment-types-container">
    <div class="header-page-container">
        <div>
            <mat-icon>supervisor_account</mat-icon>
            <h1>Usuários Administrativos</h1>
        </div>
        <div>
            <div class="opt-form-control opt-filter-list-container">
                <mat-form-field appearance="outline">
                    <mat-label>Pesquisar</mat-label>
                    <input matInput (keyup)="applyFilter($event)" placeholder="Ex. ium">
                </mat-form-field>
            </div>
            <button matTooltip="Cadastrar novo usuário administrativo" mat-button type="submit"
                [routerLink]="['/usuario-administrativo/new']">
                Adicionar
                <mat-icon>add</mat-icon>
            </button>

        </div>
    </div>
    <button [routerLink]="['/usuario-administrativo/new']" id="opt-fab-btn-add" class="opt-fab-btn-add" mat-fab>
        <mat-icon>add</mat-icon>
    </button>

    <div class="page-content">



        <table mat-table [dataSource]="dataSource" matSort class="opt-list-items">

            <ng-container matColumnDef="nome">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Nome </th>
                <td mat-cell *matCellDef="let element"> {{element?.nome || '-'}} </td>
            </ng-container>

            <ng-container matColumnDef="accessType">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Tipo de Acesso </th>
                <td mat-cell *matCellDef="let element">
                    {{ element?.accessType && getAccessType(element.accessType) || '-'}} </td>
            </ng-container>

            <ng-container matColumnDef="username">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> E-mail </th>
                <td mat-cell *matCellDef="let element"> {{element?.username || '-'}} </td>
            </ng-container>
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>
                    <p> Ações </p>
                </th>
                <td mat-cell *matCellDef="let element">
                    <div>
                        <mat-icon matTooltip="Editar" [routerLink]="['/usuario-administrativo/', element.id]">edit
                        </mat-icon>
                        <mat-icon matTooltip="Apagar" (click)="deleteElement(element)">
                            delete</mat-icon>
                    </div>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
        <p class="opt-message-empty-table" *ngIf="!isLoading && !errorTableData && !dataSource.data.length">
            Nenhumusuário administrativo cadastrado.</p>
        <p class="opt-message-error-table-data" *ngIf="!isLoading && errorTableData">Erro ao carregar dados.</p>
        <div *ngIf="isLoading" class="opt-loading-page-container">
            <mat-spinner color="light" diameter="75"></mat-spinner>
        </div>
        <mat-paginator [pageSizeOptions]="[10, 20, 30]" showFirstLastButtons></mat-paginator>
    </div>
</div>
