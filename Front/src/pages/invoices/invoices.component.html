<div class="page-container equipment-types-container">
    <div class="header-page-container">
        <div>
            <mat-icon>receipt</mat-icon>
            <h1>Faturas</h1>
        </div>
        <div>
            <div class="opt-form-control opt-filter-list-container">
                <mat-form-field appearance="outline">
                    <mat-label>Pesquisar</mat-label>
                    <input matInput (keyup)="applyFilter($event)" placeholder="Ex. ium">
                </mat-form-field>
            </div>
        </div>
    </div>
    <div class="page-content">
        <table mat-table [dataSource]="dataSource" matSort class="opt-list-items">
            <ng-container matColumnDef="dataCobranca">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Data </th>
                <td mat-cell *matCellDef="let element"> {{ element?.dataCobranca | date: 'dd/MM/yyyy' }} </td>
            </ng-container>
            <ng-container matColumnDef="valor">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Valor Cobrável </th>
                <td mat-cell *matCellDef="let element">
                    {{ (element?.valor | currency: 'BRL') || (0 | currency: 'BRL') }} </td>
            </ng-container>
            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Status </th>
                <td mat-cell *matCellDef="let element"> <span
                        [ngClass]="{'opt-status-confirm': element.status === 'PAGA', 'opt-status-warning': element.status === 'EM_ABERTO'}">{{ element?.status }}</span>
                </td>
            </ng-container>
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>
                    <p> Ações </p>
                </th>
                <td mat-cell *matCellDef="let element">
                    <div class="icon-open-invoice">
                        <mat-icon matTooltip="Visualizar" [routerLink]="['/fatura/', element.id]">visibility
                        </mat-icon>
                    </div>
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
        <p class="opt-message-empty-table" *ngIf="!isLoading && !errorTableData && !dataSource.data.length">Nenhuma
            fatura cadastrada.</p>
        <p class="opt-message-error-table-data" *ngIf="!isLoading && errorTableData">Erro ao carregar dados.</p>
        <div *ngIf="isLoading" class="opt-loading-page-container">
            <mat-spinner color="light" diameter="75"></mat-spinner>
        </div>
        <mat-paginator [pageSizeOptions]="[10, 20, 30]" showFirstLastButtons></mat-paginator>
    </div>
</div>
