<div class="page-container rooms-container">
    <div class="header-page-container">
        <div>
            <mat-icon>apps</mat-icon>
            <h1>Salas</h1>
        </div>
        <div>
            <div class="opt-form-control opt-filter-list-container">
                <mat-form-field appearance="outline">
                    <mat-label>Pesquisar</mat-label>
                    <input matInput (keyup)="applyFilter($event)" placeholder="Ex. ium">
                </mat-form-field>
            </div>
            <button matTooltip="Cadastrar nova sala" mat-button type="button" [routerLink]="['/sala/new']">
                Adicionar
                <mat-icon>add</mat-icon>
            </button>

        </div>
    </div>
    <button id="opt-fab-btn-add" class="opt-fab-btn-add" mat-fab [routerLink]="['/sala/new']">
        <mat-icon>add</mat-icon>
    </button>

    <div class="page-content">



        <table mat-table [dataSource]="dataSource" matSort class="opt-list-items">

            <ng-container matColumnDef="nome">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Nome </th>
                <td mat-cell *matCellDef="let element"> {{element.nome}} </td>
            </ng-container>
            <ng-container matColumnDef="especialidade">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Especialidade </th>
                <td mat-cell *matCellDef="let element"> {{element.especialidadeNome}} </td>
            </ng-container>
            <ng-container matColumnDef="local">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Local </th>
                <td mat-cell *matCellDef="let element"> {{element.localNome}} </td>
            </ng-container>

            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Status </th>
                <td mat-cell *matCellDef="let element"> <span
                        [ngClass]="{'opt-status-confirm': element.status === 'DISPONÍVEL', 'opt-status-warning': element.status === 'RESERVADO', 'opt-status-danger': element.status === 'MANUTENÇÃO'}">{{element.status}}</span>
                </td>
            </ng-container>

            <ng-container matColumnDef="reserva">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Reserva </th>
                <td mat-cell *matCellDef="let element"> <span
                        [ngClass]="{'opt-status-confirm': element.reserva === 1, 'opt-status-danger': element.reserva === 0}">{{element.reserva === 0 ? 'Não' : 'Sim'}}</span>
                </td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>
                    <p> Ações </p>
                </th>
                <td mat-cell *matCellDef="let element">
                    <div>
                        <mat-icon matTooltip="Editar" [routerLink]="['/sala/', element.id]">edit
                        </mat-icon>
                        <mat-icon matTooltip="Apagar" (click)="deleteElement(element)">delete</mat-icon>
                    </div>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
        <p class="opt-message-empty-table" *ngIf="!isLoading && !errorTableData && !dataSource.data.length">
            Nenhuma sala cadastrada.
        </p>
        <p class="opt-message-error-table-data" *ngIf="!isLoading && errorTableData">Erro ao carregar dados.</p>
        <div *ngIf="isLoading" class="opt-loading-page-container">
            <mat-spinner color="light" diameter="75"></mat-spinner>
        </div>
        <mat-paginator [pageSizeOptions]="[10, 20, 30]" showFirstLastButtons></mat-paginator>
    </div>
</div>
